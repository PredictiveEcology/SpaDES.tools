# Thin caller — shared logic lives in PredictiveEcology/actions (reusable workflow).
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

name: test-coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default deny at the file level: a job added later cannot silently inherit
# the org-wide `write` default. Each job re-grants what it needs.
permissions: {}

jobs:
  test-coverage:
    permissions:
      contents: read
    # Tracks @main, the org standard: fixes land here without a pin bump, and
    # PredictiveEcology/actions now gates its own merges with a self-test.
    # A tag is not safer -- tags do not move, and the newest one
    # (v0.5 = 62d556f) predates e74180e, which fixed the no-suggests leg.
    # A SHA bought less isolation than it looked: the reusable workflow
    # resolves setup-r-deps@main at run time, so pinning the caller never
    # froze the actions it calls.
    uses: PredictiveEcology/actions/.github/workflows/test-coverage.yaml@main
    # Name the one secret this needs rather than inheriting all of them. The
    # reusable workflow also declares GOOGLEDRIVE_AUTH, which is deliberately
    # NOT passed: SpaDES.tools has no Drive-backed tests, and inheriting it
    # put an org-level personal Drive OAuth token into a job that runs the
    # whole test suite and prints the account identity into a public log.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
