on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

name: test-coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GOOGLEDRIVE_AUTH: ${{ secrets.GOOGLEDRIVE_AUTH }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: PredictiveEcology/actions/install-spatial-deps@v0.2

      # libuv1-dev (-> fs) and libmagick++-dev (-> magick) are needed when
      # the remotes fallback source-installs Suggests-chain deps that the
      # pak/rspm binary path would have skipped compiling.
      - name: Install extra system dependencies for source builds (Linux)
        run: |
          sudo apt-get install -y libuv1-dev libmagick++-dev
        shell: bash

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: 'https://predictiveecology.r-universe.dev/'
          Ncpus: 2
          use-public-rspm: false

      - id: deps
        continue-on-error: true
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Pin pak stable; devel-pak occasionally regresses on resolve.
          pak-version: stable
          # Bump alongside R-CMD-check's cache-version when stale binaries
          # need to be invalidated.
          cache-version: 2
          extra-packages: |
            any::covr
            NLMR=?ignore

      # Fallback path when pak resolution fails (e.g. pak stable 0.9.5's
      # `if (any(sel)) ... missing value` regression in pkgplan_solve).
      # Bypass pak entirely and use `remotes` against CRAN +
      # PredictiveEcology r-universe instead. nick-fields/retry only
      # accepts a standard shell, so wrap Rscript via bash.
      - name: Install R deps (remotes fallback)
        if: steps.deps.outcome == 'failure'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 60
          retry_on: error
          shell: bash
          command: |
            Rscript -e 'install.packages(c("remotes", "covr"), repos = c("https://cloud.r-project.org"))' \
                    -e 'remotes::install_deps(dependencies = TRUE, repos = c("https://predictiveecology.r-universe.dev/", "https://cloud.r-project.org"))'

      - name: Install additional package dependencies
        run: |
          if (!requireNamespace("remotes", quietly = TRUE))
            install.packages("remotes", repos = "https://cloud.r-project.org")
          remotes::install_github("ropensci/NLMR")
        shell: Rscript {0}

      - id: covr
        name: Test coverage
        continue-on-error: true
        # Wrap covr in tryCatch so the per-session tempdir's
        # `test-all.Rout.fail` is dumped to the GHA log _before_ R exits and
        # the tempdir is cleaned up. Without this, a covr failure surfaces
        # only as an opaque "Package installation did not succeed" with the
        # actual failing test names and tracebacks lost.
        run: |
          res <- tryCatch(
            covr::codecov(token = Sys.getenv("CODECOV_TOKEN")),
            error = function(e) e
          )
          if (inherits(res, "error")) {
            files <- list.files(
              tempdir(), pattern = "test-all\\.Rout\\.fail$",
              recursive = TRUE, full.names = TRUE
            )
            for (f in files) {
              cat("==========================================\n")
              cat("=== ", f, " ===\n", sep = "")
              cat("==========================================\n")
              cat(readLines(f, warn = FALSE), sep = "\n")
              cat("\n")
            }
            stop(res)
          }
        shell: Rscript {0}

      - if: steps.covr.outcome == 'failure'
        name: Re-fail the job
        run: exit 1
