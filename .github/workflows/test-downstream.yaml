# Thin caller — shared logic lives in PredictiveEcology/actions (reusable workflow).
#
# Checks SpaDES.core against THIS branch. SpaDES.core pins
# PredictiveEcology/SpaDES.tools@development in its Remotes:, and
# SpaDES.tools is only in its Suggests: — so without the reusable
# workflow's unpinning and its RemoteSha assertion, this check would
# resolve SpaDES.tools from GitHub (or fail to install it entirely, which
# is only a NOTE) and pass while testing none of the change.
# See PredictiveEcology/actions#19.
#
# SpaDES.project is deliberately not listed: it has no SpaDES.tools
# dependency, so checking it here would cost CI time for no signal.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

name: test-downstream

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default deny at the file level: a job added later cannot silently inherit
# the org-wide `write` default. Each job re-grants what it needs.
permissions: {}

jobs:
  test-downstream:
    permissions:
      contents: read
    # No `secrets:` block: the reusable workflow declares only the optional
    # GOOGLEDRIVE_AUTH. Not passing it means any Drive-backed test in the
    # downstream package skips rather than runs. That is the intended
    # trade-off -- this check exists to catch API breakage in SpaDES.tools,
    # not to exercise the downstream's cloud storage.
    # Pinned to a SHA, not a tag: the newest tag (v0.5 = 62d556f) predates
    # e74180e, which fixed the no-suggests leg, so pinning to it would bring
    # that bug back. c2b2459 is main at the time of pinning.
    uses: PredictiveEcology/actions/.github/workflows/test-downstream.yaml@c2b2459
    with:
      downstream: >-
        [{"repo": "PredictiveEcology/SpaDES.core", "ref": "development"}]
      check-args: 'c("--no-manual", "--as-cran", "--run-dontrun", "--run-donttest")'
