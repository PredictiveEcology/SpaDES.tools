# Thin caller — shared logic lives in PredictiveEcology/actions (reusable workflow).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

# Default deny at the file level: a job added later cannot silently inherit
# the org-wide `write` default. Each job re-grants what it needs.
permissions: {}

jobs:
  pkgdown:
    # `contents: write` is required, and only because the deploy step pushes
    # the built site to the gh-pages branch. Nothing else here needs it.
    permissions:
      contents: write
    # No `secrets:` block: the reusable workflow declares none, so
    # `secrets: inherit` was handing this job every repo and org secret for
    # nothing -- including to the third-party deploy action it runs.
    # Pinned to a SHA, not a tag: the newest tag (v0.5 = 62d556f) predates
    # e74180e, which fixed the no-suggests leg, so pinning to it would bring
    # that bug back. That SHA is main at the time of pinning.
    # NOTE: must be the FULL 40-character SHA -- GitHub cannot resolve a
    # short SHA in `uses:`, and the workflow fails to start with no jobs.
    uses: PredictiveEcology/actions/.github/workflows/pkgdown.yaml@main
