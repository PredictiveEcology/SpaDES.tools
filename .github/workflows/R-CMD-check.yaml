# Thin caller — shared logic lives in PredictiveEcology/actions (reusable workflow).
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

name: R-CMD-check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default deny at the file level: a job added later cannot silently inherit
# the org-wide `write` default. Each job re-grants what it needs.
permissions: {}

jobs:
  R-CMD-check:
    # Least privilege: this job only reads the repo. It does not deploy,
    # comment, or push.
    permissions:
      contents: read
    # No `secrets:` block on purpose. The reusable workflow declares exactly
    # one optional secret, GOOGLEDRIVE_AUTH, and SpaDES.tools has no
    # Drive-backed tests -- so it needs nothing. `secrets: inherit` used to
    # hand this job EVERY secret the repo can see (including the org-level
    # Drive OAuth token) and expose them to the third-party packages the
    # dependency install builds from source.
    # Tracks @main, the org standard: fixes land here without a pin bump, and
    # PredictiveEcology/actions now gates its own merges with a self-test.
    # A tag is not safer -- tags do not move, and the newest one
    # (v0.5 = 62d556f) predates e74180e, which fixed the no-suggests leg.
    # A SHA bought less isolation than it looked: the reusable workflow
    # resolves setup-r-deps@main at run time, so pinning the caller never
    # froze the actions it calls.
    uses: PredictiveEcology/actions/.github/workflows/R-CMD-check.yaml@main
    with:
      # Extra legs SpaDES.tools tested pre-migration, on top of the reusable base
      # (release + oldrel-1 + ubuntu nosuggests): windows nosuggests, and
      # windows/ubuntu oldrel-2.
      # Deep matrix legs pinned to exact R versions, not oldrel-N. The oldrel
      # ladder is platform-dependent and not monotone: on ubuntu-latest
      # oldrel-4 and oldrel-5 both resolve to 4.1.3 and R 4.2 is unreachable
      # entirely; on ubuntu-22.04 oldrel-4 gives R 3.6.3. It also shifts every
      # time R releases. DESCRIPTION declares R (>= 4.3), so 4.3 is the
      # version this matrix has to prove -- oldrel-2 stopped at 4.4.
      extra-config: |
        [{"config": {"os": "windows-latest", "nosuggests": true,  "r": "release"}},
         {"config": {"os": "windows-latest", "nosuggests": false, "r": "4.4"}},
         {"config": {"os": "ubuntu-latest",  "nosuggests": false, "r": "4.4"}},
         {"config": {"os": "ubuntu-latest",  "nosuggests": false, "r": "4.3"}}]
