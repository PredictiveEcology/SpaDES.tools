on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, nosuggests ${{ matrix.config.nosuggests }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,    nosuggests: false, r: 'release'}
          - {os: windows-latest,  nosuggests: false, r: 'devel', http-user-agent: 'release'}
          - {os: windows-latest,  nosuggests: false, r: 'release'}
          - {os: windows-latest,  nosuggests: true,  r: 'release'}
          - {os: windows-latest,  nosuggests: false, r: 'oldrel-1'}
          - {os: windows-latest,  nosuggests: false, r: 'oldrel-2'}
          - {os: ubuntu-latest,   nosuggests: false, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   nosuggests: false, r: 'release'}
          - {os: ubuntu-latest,   nosuggests: true,  r: 'release'}
          - {os: ubuntu-latest,   nosuggests: false, r: 'oldrel-1'}
          - {os: ubuntu-latest,   nosuggests: false, r: 'oldrel-2'}

    env:
      _R_CHECK_DEPENDS_ONLY_: ${{ matrix.config.nosuggests }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OMP_THREAD_LIMIT: 2
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # Install spatial system deps inline. Replaces
      # PredictiveEcology/actions/install-spatial-deps@v0.2, which has been
      # failing on Ubuntu runners because `add-apt-repository ppa:ubuntugis/
      # ubuntugis-unstable` times out reaching launchpad. Ubuntu 24.04's
      # default repos already ship a recent enough GDAL/GEOS/PROJ for terra,
      # so the PPA is no longer needed.
      - name: Install spatial system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev libsqlite3-dev
        shell: bash

      - name: Install spatial system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config
          brew install gdal
        shell: bash

      # On macOS the Homebrew GDAL/PROJ install does not always leave
      # `proj.db` on PROJ's default search path. Without it, every
      # `terra::project()` / `terra::crs()` call emits
      #   PROJ: proj_create_from_name: Cannot find proj.db (GDAL error 1)
      # and reprojections fail. Point PROJ at Homebrew's data dir explicitly.
      - name: Configure PROJ data path (macOS)
        if: runner.os == 'macOS'
        run: |
          PROJ_PREFIX="$(brew --prefix proj 2>/dev/null || true)"
          PROJ_DATA="$PROJ_PREFIX/share/proj"
          if [ ! -d "$PROJ_DATA" ]; then PROJ_DATA="/usr/local/share/proj"; fi
          if [ ! -d "$PROJ_DATA" ]; then PROJ_DATA="/opt/homebrew/share/proj"; fi
          echo "PROJ_DATA=$PROJ_DATA" >> "$GITHUB_ENV"
          echo "PROJ_LIB=$PROJ_DATA"  >> "$GITHUB_ENV"
          echo "Using PROJ_DATA=$PROJ_DATA"
          ls -1 "$PROJ_DATA" | head -5 || true
        shell: bash

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: 'https://predictiveecology.r-universe.dev/'
          http-user-agent: ${{ matrix.config.http-user-agent }}
          Ncpus: 2
          r-version: ${{ matrix.config.r }}
          use-public-rspm: false

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            NLMR=?ignore

      - name: Install additional package dependencies
        run: |
          pak::pkg_install("remotes")
          remotes::install_github("ropensci/NLMR")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
