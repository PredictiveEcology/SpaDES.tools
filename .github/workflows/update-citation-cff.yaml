# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# The action runs when:
# - A new release is published
# - The DESCRIPTION or inst/CITATION are modified
# - Can be run manually
# For customizing the triggers, visit https://docs.github.com/en/actions/learn-github-actions/events-that-trigger-workflows
on:
  release:
    types: [published]
  push:
    branches: [master, main]
    paths:
      - DESCRIPTION
      - inst/CITATION
  workflow_dispatch:

name: Update CITATION.cff

# Default deny at the file level; the job below re-grants what it needs.
permissions: {}

jobs:
  update-citation-cff:
    runs-on: ubuntu-latest
    # `contents: write` is required: the last step commits and pushes
    # CITATION.cff back to the branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Do not leave a write-scoped credential in .git/config while the
          # steps below build V8 and the rest of the tree from source --
          # a source install runs the package's own configure script, which
          # could read it back out. The push below supplies its own token.
          persist-credentials: false

      - uses: PredictiveEcology/actions/install-spatial-deps@v0.2

      - uses: r-lib/actions/setup-r@v2
        with:
          Ncpus: 2
          r-version: 'release'
          use-public-rspm: false

      - uses: r-lib/actions/setup-r-dependencies@v2
        # Scoped here rather than job-level: this is the only step that needs
        # to authenticate to GitHub, and a job-level env put the token in
        # reach of every package build script that runs.
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          extra-packages: |
            any::cffr
            any::V8

      - name: Update CITATION.cff
        run: |

          library(cffr)

          # Customize with your own code
          # See https://docs.ropensci.org/cffr/articles/cffr.html

          # Write your own keys
          mykeys <- list()

          # Create your CITATION.cff file
          cff_write(keys = mykeys)

        shell: Rscript {0}

      - name: Commit results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CITATION.cff
          git commit -m 'Update CITATION.cff' || exit 0
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"
